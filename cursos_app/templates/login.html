<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduFlow - Iniciar Sesión</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "surface-bright": "#f7f9fb",
                        "surface-container-low": "#f2f4f6",
                        "tertiary": "#611e00",
                        "outline-variant": "#c4c5d5",
                        "background": "#f7f9fb",
                        "surface-container-high": "#e6e8ea",
                        "secondary": "#0058be",
                        "tertiary-fixed-dim": "#ffb59a",
                        "on-tertiary-container": "#ffa583",
                        "secondary-fixed-dim": "#adc6ff",
                        "secondary-fixed": "#d8e2ff",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#eff1f3",
                        "on-secondary": "#ffffff",
                        "on-background": "#191c1e",
                        "on-secondary-fixed": "#001a42",
                        "on-primary-fixed": "#001453",
                        "surface": "#f7f9fb",
                        "on-tertiary-fixed-variant": "#802a00",
                        "primary-container": "#1e40af",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#00288e",
                        "primary-fixed-dim": "#b8c4ff",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-fixed": "#380d00",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1e",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#a8b8ff",
                        "inverse-primary": "#b8c4ff",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#444653",
                        "surface-container": "#eceef0",
                        "on-primary-fixed-variant": "#173bab",
                        "surface-dim": "#d8dadc",
                        "secondary-container": "#2170e4",
                        "tertiary-fixed": "#ffdbce",
                        "on-secondary-fixed-variant": "#004395",
                        "tertiary-container": "#872d00",
                        "on-secondary-container": "#fefcff",
                        "surface-tint": "#3755c3",
                        "inverse-surface": "#2d3133",
                        "error-container": "#ffdad6",
                        "outline": "#757684",
                        "primary-fixed": "#dde1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "margin-mobile": "16px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "gutter": "24px",
                        "stack-lg": "32px",
                        "container-max": "1280px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            border-color: #3B82F6;
        }
    </style>
</head>
<body class="h-full bg-background font-body-md text-body-md text-on-surface antialiased flex flex-col">
<!-- TopNavBar: Intent is transactional/login, so nav is suppressed per rules, but user explicitly asked to include it. 
         However, conflict protocol says "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional: Login".
         I will suppress the nav shell to prioritize the canvas, adhering strictly to the Semantic Shell Mandate over the prompt suggestion if it violates the UX core rule. Wait, the prompt says "Incluye el TopNavBar para mantener la consistencia."
         I will include a simplified version representing the brand, without the full navigation links, to balance the request and the UX rule. Actually, I will just render the TopNavBar as defined in JSON but highlight nothing, as it's a login page.
    -->
<nav class="bg-surface-container-lowest dark:bg-inverse-surface shadow-sm docked full-width top-0 w-full z-50">
<div class="flex justify-between items-center w-full px-margin-desktop max-w-container-max mx-auto h-16">
<!-- Brand -->
<a class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed flex items-center gap-2" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">school</span>
                EduFlow
            </a>
<!-- Navigation (Hidden on mobile) -->
<div class="hidden md:flex items-center gap-gutter">
<a class="text-on-surface-variant dark:text-outline-variant hover:text-primary transition-colors hover:bg-surface-container-low dark:hover:bg-surface-variant transition-all active:scale-95 duration-150 px-4 py-2 rounded-lg" href="#">Cursos</a>
<a class="text-on-surface-variant dark:text-outline-variant hover:text-primary transition-colors hover:bg-surface-container-low dark:hover:bg-surface-variant transition-all active:scale-95 duration-150 px-4 py-2 rounded-lg" href="#">Sobre Nosotros</a>
<a class="text-on-surface-variant dark:text-outline-variant hover:text-primary transition-colors hover:bg-surface-container-low dark:hover:bg-surface-variant transition-all active:scale-95 duration-150 px-4 py-2 rounded-lg" href="#">Soporte</a>
</div>
<!-- Actions -->
<div class="flex items-center gap-stack-md">
<a class="font-label-md text-label-md text-primary hover:bg-surface-container-low px-4 py-2 rounded-lg transition-colors active:scale-95 duration-150 border-b-2 border-primary font-bold pb-1" href="#">Login</a>
<a class="font-label-md text-label-md bg-primary-container text-on-primary-container px-4 py-2 rounded-lg hover:bg-primary hover:text-on-primary transition-colors active:scale-95 duration-150" href="#">Registro</a>
</div>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-1 flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md bg-surface-container-lowest border border-surface-variant rounded-xl shadow-sm p-stack-lg relative overflow-hidden">
<!-- Decorative gradient orb -->
<div class="absolute -top-16 -right-16 w-32 h-32 bg-secondary-container rounded-full blur-3xl opacity-20 pointer-events-none"></div>
<div class="text-center mb-stack-lg relative z-10">
<h1 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Iniciar Sesión</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Bienvenido de nuevo a tu plataforma de aprendizaje.</p>
</div>
{% if error %}
<p class="mb-4 rounded-lg border border-[#ba1a1a] bg-[#ffdad6] px-4 py-3 text-sm text-[#93000a]" role="alert">{{ error }}</p>
{% endif %}
<form action="{% url 'login' %}" class="space-y-stack-md relative z-10" method="post">
{% csrf_token %}
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="email">Correo Electrónico</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-bright border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-0 input-glow transition-all" id="email" name="email" placeholder="nombre@ejemplo.com" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="password">Contraseña</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-bright border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-0 input-glow transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex justify-end mt-2">
<a class="font-label-sm text-label-sm text-primary hover:text-secondary-container transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
</div>
<div class="pt-stack-sm">
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-3 rounded-lg hover:bg-primary hover:text-on-primary transition-colors active:scale-[0.98] shadow-sm flex justify-center items-center gap-2" type="submit">
                        Iniciar Sesión
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-stack-lg text-center relative z-10 border-t border-surface-variant pt-stack-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    ¿No tienes una cuenta? 
                    <a class="font-label-md text-label-md text-primary hover:text-secondary-container transition-colors ml-1" href="#">Regístrate aquí</a>
</p>
</div>
</div>
</main>
</body></html>
